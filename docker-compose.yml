services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Uses the bundled Postgres below. Remove these two lines to use the
      # DATABASE_URL from .env (e.g. Neon) instead.
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/promptreel"
      DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@db:5432/promptreel"
    depends_on:
      - db
    volumes:
      - ./storage:/app/storage # rendered MP4s

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: promptreel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional local open-source model server (CPU). Start with:
  #   docker compose --profile local-ai up -d ollama
  #   docker compose exec ollama ollama pull qwen2.5:3b
  # Then set LLM_BASE_URL=http://localhost:11434/v1 (or http://ollama:11434/v1
  # when the app also runs in Docker) and LLM_MODEL=qwen2.5:3b.
  ollama:
    image: ollama/ollama
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
